[project]
name = "stellantis-auth"
version = "0.1.0"
description = "Shared JWT authentication for Stellantis backend"
requires-python = ">=3.12"
dependencies = [
    "PyJWT[crypto]>=2.8.0",
    "httpx>=0.28.0",
    "cryptography>=42.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jwt_auth"]
