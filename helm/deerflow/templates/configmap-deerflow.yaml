apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "deerflow.fullname" . }}-config
  labels:
    {{- include "deerflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: config
data:
  extensions_config.json: {{ .Values.extensionsConfig | toJson | quote }}
  config.yaml: |
    config_version: 1

    models:
      - name: gemini-3-flash
        display_name: Gemini 3 Flash
        use: langchain_google_genai:ChatGoogleGenerativeAI
        model: gemini-3-flash-preview
        google_api_key: $GOOGLE_API_KEY
        max_tokens: 1048576
        supports_thinking: true
        supports_vision: true

      - name: gemini-3.1-pro
        display_name: Gemini 3.1 Pro
        use: langchain_google_genai:ChatGoogleGenerativeAI
        model: gemini-3.1-pro-preview
        google_api_key: $GOOGLE_API_KEY
        max_tokens: 2097152
        supports_thinking: true
        supports_vision: true



    tool_groups:
      - name: file:read
      - name: file:write
      - name: bash

    tools:
      - name: ls
        group: file:read
        use: deerflow.sandbox.tools:ls_tool

      - name: read_file
        group: file:read
        use: deerflow.sandbox.tools:read_file_tool

      - name: write_file
        group: file:write
        use: deerflow.sandbox.tools:write_file_tool

      - name: str_replace
        group: file:write
        use: deerflow.sandbox.tools:str_replace_tool

      - name: bash
        group: bash
        use: deerflow.sandbox.tools:bash_tool

    sandbox:
      use: deerflow.sandbox.local:LocalSandboxProvider

    skills:
      container_path: /mnt/skills

    title:
      enabled: true
      max_words: 6
      max_chars: 60
      model_name: null

    summarization:
      enabled: true
      model_name: null
      trigger:
        - type: tokens
          value: 15564
      keep:
        type: messages
        value: 10
      trim_tokens_to_summarize: 15564
      summary_prompt: null

    memory:
      enabled: false

    checkpointer:
      type: {{ .Values.checkpointer.type }}
      connection_string: {{ .Values.checkpointer.connectionString }}

